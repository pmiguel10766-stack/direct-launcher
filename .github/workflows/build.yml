name: Build DirectLauncher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar código Java
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\classes | Out-Null
          $fontes = Get-ChildItem -Path src -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 -d build\classes $fontes

      - name: Criar DirectLauncher.jar
        shell: pwsh
        run: jar cfe build\DirectLauncher.jar Main -C build\classes .

      - name: Instalar Launch4j
        shell: pwsh
        timeout-minutes: 5
        run: choco install launch4j -y --no-progress

      - name: Gerar DirectLauncher.exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $raizes = @("C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData\chocolatey\lib")
          $jar = Get-ChildItem -Path $raizes -Recurse -Depth 3 -Filter "launch4j.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem -Path $raizes -Recurse -Depth 3 -Filter "launch4jc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($jar) {
            Write-Host "A usar jar: $($jar.FullName)"
            & java -jar $jar.FullName launch4j.xml
          } elseif ($exe) {
            Write-Host "A usar exe: $($exe.FullName)"
            & $exe.FullName launch4j.xml
          } else {
            throw "Launch4j não encontrado em Program Files nem em chocolatey\lib"
          }
          if ($LASTEXITCODE -ne 0) { throw "Launch4j falhou com código $LASTEXITCODE" }
          if (-not (Test-Path build\DirectLauncher.exe)) { throw "DirectLauncher.exe não foi gerado" }

      - name: Calcular SHA-256
        shell: pwsh
        run: Get-FileHash build\DirectLauncher.exe -Algorithm SHA256 | Format-List

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DirectLauncher
          path: build/DirectLauncher.exe
